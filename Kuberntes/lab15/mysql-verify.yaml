apiVersion: v1
kind: Pod
metadata:
  name: mysql-verify
  namespace: ivolve
spec:
  restartPolicy: Never
  nodeSelector:
    project: ivolve
  tolerations:
    - key: workload
      operator: Equal
      value: ivolveApp
      effect: NoSchedule
  containers:
    - name: mysql-client
      image: mysql:8.0
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: ivolve-cm
        - secretRef:
            name: ivolve-secret
